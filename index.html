<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paludarium Signal // Live Feed</title>
  <style>
    :root {
      --phosphor-green: #39ff14;
      --phosphor-glow: rgba(57, 255, 20, 0.75);
      --phosphor-dim: #1e870e;
      --screen-dark: #030805;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    .fullscreen-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: var(--screen-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .full-video-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.8s ease;
      filter: contrast(1.06) saturate(1.12) brightness(0.98);
      z-index: 1;
    }
    .full-video-layer.active {
      opacity: 1;
    }

    #staticNoise {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.95;
      mix-blend-mode: screen;
      transition: opacity 1s ease;
    }

    .scanlines-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0) 50%,
        rgba(0, 0, 0, 0.45) 51%,
        rgba(0, 0, 0, 0.45)
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 3;
      opacity: 0.85;
      transition: opacity 2.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .scanlines-overlay.fade-out {
      opacity: 0;
    }

    .glass-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.85) 100%);
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      z-index: 4;
    }

    .top-signal-hud {
      position: absolute;
      top: 24px;
      left: 28px;
      z-index: 10;
      font-size: 13px;
      font-weight: bold;
      color: var(--phosphor-green);
      text-shadow: 0 0 6px var(--phosphor-glow), 0 0 14px rgba(57, 255, 20, 0.6);
      letter-spacing: 2px;
      pointer-events: none;
      line-height: 1.5;
    }

    .live-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #ff2a2a;
      border-radius: 50%;
      margin-left: 6px;
      box-shadow: 0 0 8px #ff2a2a;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .bottom-phosphor-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 32px 36px 28px 36px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.65) 60%, transparent 100%);
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: flex-end;
      pointer-events: none;
    }

    .title-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .main-title {
      font-size: 26px;
      font-weight: 900;
      color: var(--phosphor-green);
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 
        0 0 8px var(--phosphor-glow),
        0 0 20px rgba(57, 255, 20, 0.5);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sub-telemetry {
      font-size: 12px;
      letter-spacing: 2px;
      color: #79bf77;
      text-shadow: 0 0 4px rgba(57, 255, 20, 0.4);
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .telemetry-item span {
      color: var(--phosphor-green);
      font-weight: bold;
    }

    .interactive-badges {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .hud-btn {
      background: rgba(8, 26, 12, 0.7);
      border: 1px solid var(--phosphor-dim);
      color: var(--phosphor-green);
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      text-shadow: 0 0 4px var(--phosphor-glow);
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
    }
    .hud-btn:hover {
      background: rgba(18, 56, 26, 0.9);
      border-color: var(--phosphor-green);
      box-shadow: 0 0 12px rgba(57, 255, 20, 0.4);
    }

    @keyframes phosphorFlicker {
      0% { opacity: 0.97; }
      50% { opacity: 1; }
      52% { opacity: 0.92; }
      54% { opacity: 1; }
      80% { opacity: 0.98; }
      100% { opacity: 1; }
    }
    .main-title, .top-signal-hud {
      animation: phosphorFlicker 0.15s infinite;
    }

    @media (max-width: 768px) {
      .bottom-phosphor-bar {
        grid-template-columns: 1fr;
        padding: 20px 18px;
        gap: 14px;
      }
      .main-title {
        font-size: 19px;
        letter-spacing: 2.5px;
      }
      .sub-telemetry {
        font-size: 10px;
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="fullscreen-stage" id="stage">
    
    <video 
      id="paludariumVideo" 
      class="full-video-layer" 
      playsinline 
      loop 
      muted 
      preload="auto">
      <source src="paludarium_stream.mp4" type="video/mp4">
      Your browser does not support vintage signal playback.
    </video>

    <canvas id="staticNoise"></canvas>
    <div class="scanlines-overlay" id="scanlines"></div>
    <div class="glass-vignette"></div>

    <div class="top-signal-hud">
      SIGNAL: 82.4 MHz // CH 03<br>
      <span style="font-size: 10px; opacity: 0.85;" id="statusMsg">TUNING SIGNAL...</span>
    </div>

    <div class="bottom-phosphor-bar">
      
      <div class="title-group">
        <div class="main-title">
          PALUDARIUM <span>// LIVE</span>
        </div>
        <div class="sub-telemetry">
          <div class="telemetry-item">STATUS: <span id="telemetryStatus">EPHEMERAL FEED</span></div>
          <div class="telemetry-item">SOURCE: <span>HAND-HELD 1080p</span></div>
          <div class="telemetry-item">AUDIO: <span id="audioStatus">MUTED</span></div>
        </div>
      </div>

      <div class="interactive-badges">
        <button class="hud-btn" id="audioBtn">TOGGLE AUDIO</button>
        <button class="hud-btn" id="tuneBtn">RE-SYNC</button>
      </div>

    </div>

  </div>

  <script>
    const canvas = document.getElementById('staticNoise');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('paludariumVideo');
    const statusMsg = document.getElementById('statusMsg');
    const scanlines = document.getElementById('scanlines');
    const audioBtn = document.getElementById('audioBtn');
    const tuneBtn = document.getElementById('tuneBtn');
    const audioStatus = document.getElementById('audioStatus');
    const stage = document.getElementById('stage');

    let isTuned = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth / 2;
      canvas.height = window.innerHeight / 2;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function generateNoise() {
      if (isTuned && canvas.style.opacity === "0") {
        requestAnimationFrame(generateNoise);
        return;
      }

      const imgData = ctx.createImageData(canvas.width, canvas.height);
      const buf = new Uint32Array(imgData.data.buffer);
      const len = buf.length;

      for (let i = 0; i < len; i++) {
        const val = (Math.random() * 255) | 0;
        buf[i] = (255 << 24) | (val << 16) | (val << 8) | val;
      }

      ctx.putImageData(imgData, 0, 0);

      if (!isTuned) {
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.25})`;
        const h = Math.random() * 25 + 2;
        const y = Math.random() * canvas.height;
        ctx.fillRect(0, y, canvas.width, h);
      }

      requestAnimationFrame(generateNoise);
    }
    requestAnimationFrame(generateNoise);

    function startTuning() {
      statusMsg.innerHTML = "SEARCHING FREQ... 82.4 MHz";
      canvas.style.opacity = "0.95";
      scanlines.classList.remove('fade-out');
      video.classList.remove('active');
      isTuned = false;

      setTimeout(() => {
        statusMsg.innerHTML = "PHASE LOCK... [V-HOLD]";
        canvas.style.opacity = "0.55";
      }, 1000);

      setTimeout(() => {
        statusMsg.innerHTML = "ACQUIRED <span class='live-indicator'></span>";
        canvas.style.opacity = "0.0";
        video.classList.add('active');
        video.play().catch(() => {});
        isTuned = true;

        setTimeout(() => {
          scanlines.classList.add('fade-out');
        }, 1200);
      }, 2300);
    }

    function toggleAudio() {
      video.muted = !video.muted;
      audioStatus.innerHTML = video.muted ? "MUTED" : "ACTIVE";
      audioBtn.innerHTML = video.muted ? "UNMUTE" : "MUTE";
    }

    audioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleAudio();
    });

    stage.addEventListener('click', (e) => {
      if (e.target !== tuneBtn && e.target !== audioBtn) {
        toggleAudio();
      }
    });

    tuneBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startTuning();
    });

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(startTuning, 600);
    });
  </script>
</body>
</html>
