<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paludarium Signal // CRT Monitor</title>
  <style>
    :root {
      --bg-room: #0a0c0e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-room);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', Courier, monospace;
      color: #8c9e8c;
      overflow-x: hidden;
      margin: 0;
      padding: 10px;
    }

    .desk-stage {
      position: relative;
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .monitor-frame {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    .monitor-bg-image {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95);
    }

    .screen-glass-anchor {
      position: absolute;
      top: 16.8%;
      left: 24.8%;
      width: 50.8%;
      height: 52.6%;
      border-radius: 8.5% 8.5% 10% 10% / 10% 10% 12% 12%;
      overflow: hidden;
      background: #020604;
      line-height: normal;
      box-shadow: 
        inset 0 0 45px rgba(0, 0, 0, 0.98),
        inset 0 0 90px rgba(5, 30, 20, 0.7);
      transform: translateZ(0);
    }

    .crt-video-feed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.8s ease;
      filter: contrast(1.18) saturate(1.22) brightness(0.92);
      transform: scale(1.03);
    }
    .crt-video-feed.active {
      opacity: 1;
    }

    #staticNoise {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      opacity: 0.92;
      mix-blend-mode: screen;
      transition: opacity 0.9s ease;
    }

    .crt-scanline-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0) 50%,
        rgba(0, 0, 0, 0.45) 51%,
        rgba(0, 0, 0, 0.45)
      );
      background-size: 100% 3px;
      pointer-events: none;
      z-index: 4;
      opacity: 0.65;
    }

    .crt-glass-glare {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.08) 25%, transparent 55%),
        radial-gradient(circle at 82% 80%, rgba(180, 220, 200, 0.12) 0%, transparent 42%),
        radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.85) 100%);
      pointer-events: none;
      z-index: 5;
    }

    .crt-hud-display {
      position: absolute;
      top: 18px;
      left: 22px;
      z-index: 6;
      font-size: 13px;
      font-weight: bold;
      color: #39ff14;
      text-shadow: 0 0 6px #39ff14, 0 0 12px rgba(57, 255, 20, 0.8);
      letter-spacing: 2px;
      pointer-events: none;
      line-height: 1.4;
    }

    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #ff2a2a;
      border-radius: 50%;
      margin-left: 6px;
      box-shadow: 0 0 8px #ff2a2a;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .knob-hotspot {
      position: absolute;
      bottom: 23%;
      width: 4.8%;
      height: 5.8%;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      background: rgba(255, 255, 255, 0.001);
    }
    .knob-left-hotspot { left: 25.5%; }
    .knob-right-hotspot { right: 23.5%; }

    .broadcast-info {
      margin-top: 16px;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #5c7468;
      text-align: center;
      line-height: 1.5;
    }

    .broadcast-info span {
      color: #8fa89b;
    }
  </style>
</head>
<body>

  <div class="desk-stage">
    
    <div class="monitor-frame">
      <img 
        src="IMG_6708.jpeg" 
        alt="Vintage IBM CRT Monitor" 
        class="monitor-bg-image"
      />

      <div class="knob-hotspot knob-left-hotspot" id="tuneBtn" title="Click to Tune / Re-sync Frequency"></div>
      <div class="knob-hotspot knob-right-hotspot" id="soundBtn" title="Click to Toggle Sound / Mute"></div>

      <div class="screen-glass-anchor" id="screenAnchor">
        <canvas id="staticNoise"></canvas>
        <div class="crt-scanline-grid"></div>
        <div class="crt-glass-glare"></div>

        <div class="crt-hud-display" id="crtHud">
          PALUDARIUM 01<br>
          <span style="font-size: 10px; opacity: 0.8;" id="statusMsg">TUNING FREQUENCY...</span>
        </div>

        <video 
          id="paludariumVideo" 
          class="crt-video-feed" 
          playsinline 
          loop 
          muted 
          preload="auto">
          <source src="paludarium_stream.mp4" type="video/mp4">
          Your browser does not support vintage CRT video playback.
        </video>

      </div>

    </div>

  </div>

  <div class="broadcast-info">
    ● <span>LIVE TRANSMISSION:</span> Ephemeral live signal • Click screen or knobs to tune / un-mute audio.
  </div>

  <script>
    const canvas = document.getElementById('staticNoise');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('paludariumVideo');
    const statusMsg = document.getElementById('statusMsg');
    const tuneBtn = document.getElementById('tuneBtn');
    const soundBtn = document.getElementById('soundBtn');
    const screenAnchor = document.getElementById('screenAnchor');

    let isPowered = true;
    let isTuned = false;

    function resizeCanvas() {
      canvas.width = screenAnchor.clientWidth / 2;
      canvas.height = screenAnchor.clientHeight / 2;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function generateNoise() {
      if (!isPowered) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        requestAnimationFrame(generateNoise);
        return;
      }

      const imgData = ctx.createImageData(canvas.width, canvas.height);
      const buf = new Uint32Array(imgData.data.buffer);
      const len = buf.length;

      for (let i = 0; i < len; i++) {
        const val = (Math.random() * 255) | 0;
        buf[i] = (255 << 24) | (val << 16) | (val << 8) | val;
      }

      ctx.putImageData(imgData, 0, 0);

      if (!isTuned) {
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.25})`;
        const h = Math.random() * 25 + 2;
        const y = Math.random() * canvas.height;
        ctx.fillRect(0, y, canvas.width, h);
      }

      requestAnimationFrame(generateNoise);
    }
    requestAnimationFrame(generateNoise);

    function startTuning() {
      statusMsg.innerHTML = "SEARCHING FREQ... 82.4 MHz";
      canvas.style.opacity = "0.95";
      video.classList.remove('active');
      isTuned = false;

      setTimeout(() => {
        statusMsg.innerHTML = "PHASE LOCK... [V-HOLD]";
        canvas.style.opacity = "0.55";
      }, 1000);

      setTimeout(() => {
        statusMsg.innerHTML = "ACQUIRED <span class='live-dot'></span>";
        canvas.style.opacity = "0.06";
        video.classList.add('active');
        video.play().catch(() => {
          statusMsg.innerHTML += "<br><span style='font-size:9px; color:#ffdd44;'>CLICK FOR AUDIO</span>";
        });
        isTuned = true;
      }, 2300);
    }

    tuneBtn.addEventListener('click', startTuning);
    screenAnchor.addEventListener('click', () => {
      video.muted = !video.muted;
      statusMsg.innerHTML = video.muted ? "AUDIO: MUTED" : "AUDIO: ON";
      setTimeout(() => {
        if (isTuned) statusMsg.innerHTML = "ACQUIRED <span class='live-dot'></span>";
      }, 1500);
    });

    soundBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      statusMsg.innerHTML = video.muted ? "AUDIO: MUTED" : "AUDIO: ON";
      setTimeout(() => {
        if (isTuned) statusMsg.innerHTML = "ACQUIRED <span class='live-dot'></span>";
      }, 1500);
    });

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(startTuning, 600);
    });
  </script>
</body>
</html>
