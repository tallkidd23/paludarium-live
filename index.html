<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paludarium Signal // CRT Monitor</title>
  <style>
    :root {
      --bg-room: #0a0c0e;
      --phosphor-green: #39ff14;
      --phosphor-glow: rgba(57, 255, 20, 0.75);
      --phosphor-dim: #1e870e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-room);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', Courier, monospace;
      color: #8c9e8c;
      overflow-x: hidden;
      margin: 0;
      padding: 10px;
    }

    .desk-stage {
      position: relative;
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .monitor-frame {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    .monitor-bg-image {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95);
    }

    /* Screen Bulb Inset */
    .screen-glass-anchor {
      position: absolute;
      top: 16.8%;
      left: 24.8%;
      width: 50.8%;
      height: 52.6%;
      border-radius: 8.5% 8.5% 10% 10% / 10% 10% 12% 12%;
      overflow: hidden;
      background: #020604;
      line-height: normal;
      box-shadow: 
        inset 0 0 45px rgba(0, 0, 0, 0.98),
        inset 0 0 90px rgba(5, 30, 20, 0.7);
      transform: translateZ(0);
      cursor: pointer;
    }

    /* Video positioned right at the top border of the CRT bulb */
    .crt-video-feed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 82%; /* Tight top placement leaving clean bottom title strip */
      object-fit: fill; /* Extends from left edge to right edge flush against top */
      opacity: 0;
      transition: opacity 1.8s ease;
      filter: contrast(1.06) saturate(1.12) brightness(1.0);
    }
    .crt-video-feed.active {
      opacity: 1;
    }

    #staticNoise {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      opacity: 0.92;
      mix-blend-mode: screen;
      transition: opacity 0.9s ease;
    }

    .crt-scanline-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0) 50%,
        rgba(0, 0, 0, 0.45) 51%,
        rgba(0, 0, 0, 0.45)
      );
      background-size: 100% 3px;
      pointer-events: none;
      z-index: 4;
      opacity: 0.85;
      transition: opacity 2.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .crt-scanline-grid.fade-out {
      opacity: 0;
    }

    .crt-glass-glare {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.05) 25%, transparent 55%),
        radial-gradient(circle at 82% 80%, rgba(180, 220, 200, 0.1) 0%, transparent 42%),
        radial-gradient(circle at 50% 50%, transparent 65%, rgba(0, 0, 0, 0.8) 100%);
      pointer-events: none;
      z-index: 5;
    }

    /* Bottom Phosphor Green Titles */
    .bottom-screen-titlebar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 18%;
      padding: 0 14px;
      background: #020604;
      border-top: 1px solid rgba(57, 255, 20, 0.15);
      z-index: 6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .title-main {
      font-size: 13px;
      font-weight: 900;
      color: var(--phosphor-green);
      letter-spacing: 2.5px;
      text-shadow: 0 0 6px var(--phosphor-glow), 0 0 14px rgba(57, 255, 20, 0.6);
      text-transform: uppercase;
    }

    .title-sub {
      font-size: 8.5px;
      letter-spacing: 1.5px;
      color: #79bf77;
      text-shadow: 0 0 3px rgba(57, 255, 20, 0.4);
      margin-top: 2px;
    }

    .audio-badge {
      font-size: 8.5px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--phosphor-green);
      background: rgba(8, 26, 12, 0.6);
      border: 1px solid var(--phosphor-dim);
      padding: 2px 5px;
      border-radius: 3px;
      text-shadow: 0 0 4px var(--phosphor-glow);
    }

    /* Knob Hotspots */
    .knob-hotspot {
      position: absolute;
      bottom: 23%;
      width: 4.8%;
      height: 5.8%;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      background: rgba(255, 255, 255, 0.001);
    }
    .knob-left-hotspot { left: 25.5%; }
    .knob-right-hotspot { right: 23.5%; }

    .broadcast-info {
      margin-top: 14px;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #5c7468;
      text-align: center;
      line-height: 1.5;
    }
    .broadcast-info span {
      color: #8fa89b;
    }

    @media (max-width: 600px) {
      .bottom-screen-titlebar {
        padding: 0 8px;
      }
      .title-main {
        font-size: 10px;
        letter-spacing: 1.5px;
      }
      .title-sub {
        font-size: 7.5px;
      }
    }
  </style>
</head>
<body>

  <div class="desk-stage">
    
    <div class="monitor-frame">
      <img 
        src="IMG_6708.jpeg" 
        alt="Vintage IBM CRT Monitor" 
        class="monitor-bg-image"
      />

      <div class="knob-hotspot knob-left-hotspot" id="tuneBtn" title="Click to Tune / Re-sync Frequency"></div>
      <div class="knob-hotspot knob-right-hotspot" id="soundBtn" title="Click to Toggle Sound / Mute"></div>

      <div class="screen-glass-anchor" id="screenAnchor">
        <canvas id="staticNoise"></canvas>
        <div class="crt-scanline-grid" id="scanlines"></div>
        <div class="crt-glass-glare"></div>

        <!-- Video Player pushed firmly to the top -->
        <video 
          id="paludariumVideo" 
          class="crt-video-feed" 
          playsinline 
          loop 
          muted 
          preload="auto">
          <source src="paludarium_stream.mp4" type="video/mp4">
          Your browser does not support vintage CRT video playback.
        </video>

        <!-- Bottom Title Strip with green phosphor text -->
        <div class="bottom-screen-titlebar">
          <div>
            <div class="title-main">PALUDARIUM</div>
            <div class="title-sub">EPHEMERAL TRANSMISSION • 1080p</div>
          </div>
          <div class="audio-badge" id="audioBadge">MUTED</div>
        </div>

      </div>

    </div>

  </div>

  <div class="broadcast-info">
    ● <span>LIVE TRANSMISSION:</span> Ephemeral live signal • Click screen or knobs to tune / un-mute audio.
  </div>

  <script>
    const canvas = document.getElementById('staticNoise');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('paludariumVideo');
    const scanlines = document.getElementById('scanlines');
    const audioBadge = document.getElementById('audioBadge');
    const tuneBtn = document.getElementById('tuneBtn');
    const soundBtn = document.getElementById('soundBtn');
    const screenAnchor = document.getElementById('screenAnchor');

    let isPowered = true;
    let isTuned = false;

    function resizeCanvas() {
      canvas.width = screenAnchor.clientWidth / 2;
      canvas.height = screenAnchor.clientHeight / 2;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function generateNoise() {
      if (!isPowered) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        requestAnimationFrame(generateNoise);
        return;
      }

      const imgData = ctx.createImageData(canvas.width, canvas.height);
      const buf = new Uint32Array(imgData.data.buffer);
      const len = buf.length;

      for (let i = 0; i < len; i++) {
        const val = (Math.random() * 255) | 0;
        buf[i] = (255 << 24) | (val << 16) | (val << 8) | val;
      }

      ctx.putImageData(imgData, 0, 0);

      if (!isTuned) {
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.25})`;
        const h = Math.random() * 25 + 2;
        const y = Math.random() * canvas.height;
        ctx.fillRect(0, y, canvas.width, h);
      }

      requestAnimationFrame(generateNoise);
    }
    requestAnimationFrame(generateNoise);

    function startTuning() {
      canvas.style.opacity = "0.95";
      scanlines.classList.remove('fade-out');
      video.classList.remove('active');
      isTuned = false;

      setTimeout(() => {
        canvas.style.opacity = "0.55";
      }, 1000);

      setTimeout(() => {
        canvas.style.opacity = "0.0";
        video.classList.add('active');
        video.play().catch(() => {});
        isTuned = true;

        setTimeout(() => {
          scanlines.classList.add('fade-out');
        }, 1200);
      }, 2300);
    }

    function toggleAudio() {
      video.muted = !video.muted;
      audioBadge.innerHTML = video.muted ? "MUTED" : "AUDIO ON";
      audioBadge.style.color = video.muted ? "#39ff14" : "#ffff55";
    }

    tuneBtn.addEventListener('click', startTuning);
    screenAnchor.addEventListener('click', toggleAudio);
    soundBtn.addEventListener('click', toggleAudio);

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(startTuning, 600);
    });
  </script>
</body>
</html>
